name: Check Superhuman Version

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: superhuman-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install resolver dependencies
        run: python -m pip install requests pyyaml

      - name: Resolve current amd64 version
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          resolved=$(python scripts/resolve-download-url.py amd64 --format version)
          version=${resolved#VERSION=}
          if [[ $resolved != VERSION=* || ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve a valid Superhuman version: $resolved" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update source and dispatch release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          current_version=$(sed -nE "s/^readonly SUPERHUMAN_VERSION='([0-9]+\.[0-9]+\.[0-9]+)'$/\1/p" build.sh)
          if [[ -z $current_version ]]; then
            echo 'Could not read the version from build.sh' >&2
            exit 1
          fi

          if [[ $LATEST_VERSION != "$current_version" ]]; then
            sed -i -E "s/^readonly SUPERHUMAN_VERSION='[0-9]+\.[0-9]+\.[0-9]+'$/readonly SUPERHUMAN_VERSION='${LATEST_VERSION}'/" build.sh
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add build.sh
            git commit -m "chore(release): update Superhuman to ${LATEST_VERSION}"
            git push origin HEAD:main
          fi

          tag="v${LATEST_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            # Pushes made with GITHUB_TOKEN do not start push workflows.
            gh workflow run ci.yml --ref main --field "release_version=${LATEST_VERSION}"
            echo "Dispatched CI to build release $tag"
          fi
