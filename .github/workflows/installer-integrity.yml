name: Installer Integrity Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-installer-integrity:
    name: Test Installer Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - run: python -m pip install requests==2.34.2 PyYAML==6.0.3
      - run: python -m unittest discover -s tests -p 'test_resolve_download_url.py'
      - run: bash tests/installer-checksum.sh
