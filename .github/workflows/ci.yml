name: CI
run-name: |
  CI: ${{
    github.event_name == 'pull_request' && format('PR #{0} by @{1} - {2}', github.event.pull_request.number, github.actor, github.event.pull_request.title) ||
    github.event_name == 'push' && github.event.head_commit && format('Push by @{0} - {1}', github.actor, github.event.head_commit.message) ||
    format('{0} triggered by @{1}', github.event_name, github.actor)
  }}

on:
  push:
    branches:
      - main
    paths:
      - "build.sh"
      - "scripts/**"
      - ".github/workflows/**"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Superhuman version to publish after successful builds
        required: false
        type: string

jobs:
  test-flags:
    name: Test Flags Parsing
    uses: ./.github/workflows/test-flags.yml

  build-amd64:
    name: Build Packages (amd64 - ${{ matrix.flags || 'defaults' }})
    needs: test-flags

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            flags: ""
            artifact_suffix: "deb"
          - arch: amd64
            flags: "--build appimage --clean no"
            artifact_suffix: "appimage"

    uses: ./.github/workflows/build-amd64.yml
    with:
      build_flags: ${{ matrix.flags }}
      artifact_suffix: ${{ matrix.artifact_suffix }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: [test-flags, build-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download AMD64 deb artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: package-amd64-deb
          path: artifacts/

      - name: Download AMD64 AppImage artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: package-amd64-appimage
          path: artifacts/

      - name: Verify release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_VERSION:-${REF_NAME#v}}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          test -s "artifacts/superhuman_${version}_amd64.deb"
          test -s "artifacts/superhuman-${version}-amd64.AppImage"
          test -s artifacts/superhuman-appimage.desktop
          test -s artifacts/superhuman-appimage.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          fail_on_unmatched_files: true
